<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zara Suhail Mannan | Tilism</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;600&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e8e8e8;
            --accent-color: #d1a3ff; /* Pastel Lavender */
            --dim-text: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-style: italic; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

        /* Navigation */
        nav {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 1.5rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }

        .brand-name { font-weight: 600; letter-spacing: 2px; font-size: 0.7rem; color: #fff; }
        .nav-links { display: flex; align-items: center; gap: 1.5rem; }
        nav a { color: #fff; text-decoration: none; font-size: 0.7rem; letter-spacing: 1px; font-weight: 600; transition: 0.3s; }
        nav a:hover { color: var(--accent-color); }
        .social-icons { display: flex; gap: 1rem; margin-left: 0.5rem; font-size: 1.1rem; }

        /* Hero Section */
        header {
            position: relative;
            height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(13,13,13,1)), url('Cover%20Art.jpg');
            background-size: cover; background-position: center;
            padding: 0 1.5rem;
        }

        .hero-text-wrap { position: relative; margin-top: -50px; }

        header h1 { 
            font-size: clamp(3rem, 8vw, 4.8rem); 
            color: #fff; 
            letter-spacing: -1px; 
            line-height: 0.8; 
            position: relative;
            z-index: 2;
        }

        .urdu-accent { 
            font-family: 'Noto Nastaliq Urdu', serif; 
            color: var(--accent-color); 
            font-size: clamp(4rem, 12vw, 8.5rem); 
            display: block;
            margin-top: -0.2em; /* This creates that sexy intersection with 'Welcome to' */
            margin-bottom: 0.2em; /* This pushes the caption away */
            z-index: 1;
            font-style: normal;
        }

        header p { 
            font-size: clamp(1rem, 4vw, 1.25rem); 
            color: #ccc; 
            max-width: 700px; 
            margin: 0 auto; 
            font-family: 'Cormorant Garamond', serif; 
            font-style: italic;
            position: relative;
            z-index: 3;
            line-height: 1.4;
        }

        header p a { color: var(--accent-color); text-decoration: none; border-bottom: 1px solid var(--accent-color); }

        /* NEWS CAROUSEL REDESIGN */
        .news-wrapper {
            position: absolute;
            bottom: 3rem;
            width: 90%;
            max-width: 550px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .carousel-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0.5;
            transition: 0.3s;
        }
        .carousel-btn:hover { opacity: 1; transform: scale(1.1); }

        .news-carousel {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.2rem;
            border-radius: 8px;
            overflow: hidden;
            text-align: left;
        }

        .news-label { font-size: 0.55rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent-color); margin-bottom: 0.8rem; display: block; font-weight: 600; }
        
        .news-track { display: flex; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        .news-item {
            min-width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .news-thumb {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: #1a1a1a;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .news-thumb img { width: 18px; height: 18px; filter: grayscale(1); }

        .news-content {
            font-size: 0.85rem;
            font-style: italic;
            color: #ddd;
            font-family: 'Cormorant Garamond', serif;
            line-height: 1.3;
        }

        .news-source { display: block; font-size: 0.6rem; color: var(--accent-color); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; font-style: normal; opacity: 0.8; }

        /* Split Section Layout */
        .split-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 5rem;
            padding: 6rem 0;
            border-bottom: 1px solid #1a1a1a;
        }

        h2 { font-size: 3rem; margin-bottom: 3.5rem; color: var(--accent-color); text-transform: lowercase; }

        .essay-item { text-decoration: none; display: block; color: inherit; margin-bottom: 4.5rem; }
        .essay-item h3 { font-size: 2.2rem; margin-bottom: 1.2rem; color: #fff; line-height: 1.1; }
        .essay-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; color: var(--dim-text); padding-left: 1.5rem; border-left: 1px solid var(--accent-color); }
        .essay-item:hover h3 { color: var(--accent-color); }

        .music-item { margin-bottom: 3rem; }
        .music-title { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-color); margin-bottom: 0.8rem; display: block; }
